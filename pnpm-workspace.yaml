packages:
  - 'apps/*'
  - 'packages/*'
  - 'playgrounds/*'

# Hoist everything (default) except @types/bun. When @types/node and @types/bun are
# installed in different packages, hoisting both into the same env causes a
# conflict and breaks type checking when working on Node.js types alongside
# a package that imports from 'bun'. Excluding @types/bun from hoisting
# avoids this while keeping hoisting enabled for everything else.
hoistPattern:
  - '*'
  - '!@types/bun'

# Lets playgrounds/* resolve local packages without the 'workspace:' protocol
# during development. When a playground is cloned standalone, the same
# dependencies resolve to registry versions instead.
linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  sharp: false
  simple-git-hooks: false
  spawn-sync: false
  tree-sitter: false
  tree-sitter-json: false
  vue-demi: false
  workerd: false

# Only needed while a version is younger than the minimumReleaseAge gate.
# Entries go inert once the version ages past it, so prune them on the next bump
# instead of letting versions accumulate.
minimumReleaseAgeExclude:
  - '@standard-server/core@0.9.0'
  - '@standard-server/fetch@0.9.0'
  - '@standard-server/node@0.9.0'
  - '@standard-server/peer@0.9.0'
  - '@standard-server/shared@0.9.0'
  - '@standard-server/aws-lambda@0.9.0'
  - '@standard-server/fastify@0.9.0'
  - '@openapi-spec/downgrader@0.1.0'
  - '@openapi-spec/types@0.1.0'
  - '@cloudflare/workerd-darwin-64@1.20260907.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260907.1'
  - '@cloudflare/workerd-linux-64@1.20260907.1'
  - '@cloudflare/workerd-linux-arm64@1.20260907.1'
  - '@cloudflare/workerd-windows-64@1.20260907.1'
  - miniflare@5.20260907.0-alpha
  - workerd@1.20260907.1
  - wrangler@4.129.1
  - '@cloudflare/vite-plugin@1.54.5'
